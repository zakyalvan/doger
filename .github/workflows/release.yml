name: Release

on:
  workflow_dispatch:
    inputs:
      semver:
        type: string
        description: 'Semver (eg: v1.2.3)'
        required: true

jobs:
  release:
    # forks of this repository cannot cut releases of github.com/kartaladev/doger
    if: github.repository == 'kartaladev/doger'
    runs-on: ubuntu-latest
    # required to push the release tag and create the GitHub release
    permissions:
      contents: write
    steps:
    # the module path has no /vN suffix, so only v0 and v1 versions are valid;
    # pre-releases such as v0.2.0-rc.1 are allowed
    - name: Check semver
      env:
        SEMVER: ${{ inputs.semver }}
      run: |
          re='^v[01]\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$SEMVER" =~ $re ]]; then
            echo "::error::semver '$SEMVER' must be a v0 or v1 version such as v0.1.0 or v0.2.0-rc.1 (module path github.com/kartaladev/doger has no major-version suffix)"
            exit 1
          fi

    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.work'

    - name: Test
      run: make test
      
    # to be valid after cleanup
    - name: Drop use of ./examples/... from go.work 
      run: find ./examples -type d -exec go work edit -dropuse={} \;

    # remove tests to clean dependencies
    - name: Remove xxx_test.go files
      run: rm -rf $(find . -type f -name "*_test.go" ! -name "*_example_test.go") examples/ docs/ tests/

    - name: Cleanup dependencies
      run: go mod tidy

    # consumers ignore the adapters' local replace directives, so each adapter
    # (HTTP and scheduler) must require the root module at the version being
    # released
    - name: Pin adapters to the released root version
      env:
        SEMVER: ${{ inputs.semver }}
      run: |
          for dir in http/*/ scheduler/*/; do
            [ -f "${dir}go.mod" ] || continue
            (cd "$dir" && go mod edit -require="github.com/kartaladev/doger@${SEMVER}")
          done

    - name: List files
      run: tree -Cfi
    - name: Write new go.mod into logs
      run: cat go.mod
    - name: Write new go.sum into logs
      run: cat go.sum

    # the root module is tagged <semver>, each adapter http/<x>/<semver> or
    # scheduler/<x>/<semver>
    - name: Create tags
      env:
        SEMVER: ${{ inputs.semver }}
        ACTOR: ${{ github.triggering_actor }}
      run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "${ACTOR}@users.noreply.github.com"

          git add .
          git commit --allow-empty -m "bump ${SEMVER}"
          tags=("$SEMVER")
          for dir in http/*/ scheduler/*/; do
            [ -f "${dir}go.mod" ] || continue
            tags+=("${dir%/}/${SEMVER}")
          done
          for tag in "${tags[@]}"; do
            git tag "$tag"
          done
          git push origin "${tags[@]}"

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ inputs.semver }}
        tag_name: ${{ inputs.semver }}
