name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # built with Go 1.27; bump together with Go releases
          version: v2.15.0
          args: --timeout 120s --max-same-issues 50 --config=.golangci.yml
